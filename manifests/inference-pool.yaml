apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: vllm-metal-pool
  namespace: llm-d-metal
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
  endpointPickerRef:
    name: vllm-metal-pool-epp
    port:
      number: 9002
