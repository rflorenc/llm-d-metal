# Uses the SA and svc already created by the
# inference-gateway kustomize.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-metal-pool
  labels:
    app: vllm-metal-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-metal-pool
      component: epp
  template:
    metadata:
      labels:
        app: vllm-metal-pool
        component: epp
    spec:
      serviceAccountName: vllm-metal-pool
      terminationGracePeriodSeconds: 130
      containers:
      - name: epp
        image: ghcr.io/llm-d/llm-d-inference-scheduler:latest
        imagePullPolicy: IfNotPresent
        args:
        - --pool-name
        - vllm-metal-pool
        - --pool-namespace
        - default
        - --v
        - "4"
        - --zap-encoder
        - "json"
        - --grpc-port
        - "9002"
        - --grpc-health-port
        - "9003"
        - --config-file
        - "/etc/epp/epp-config.yaml"
        - --metrics-endpoint-auth=false
        ports:
        - containerPort: 9002
        - containerPort: 9003
        - name: metrics
          containerPort: 9090
        livenessProbe:
          grpc:
            port: 9003
            service: envoy.service.ext_proc.v3.ExternalProcessor
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 9003
            service: envoy.service.ext_proc.v3.ExternalProcessor
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: epp-config
          mountPath: /etc/epp
        - name: cache
          mountPath: /cache
        - name: uds-socket
          mountPath: /tmp/tokenizer
      # NOTE: UDS tokenizer sidecar omitted for POC.
      # Prefix-cache scoring (which requires tokenization) won't work,
      # but basic load-balanced routing will.
      volumes:
      - name: epp-config
        configMap:
          name: epp-config
      - name: cache
        emptyDir: {}
      - name: uds-socket
        emptyDir: {}
