apiVersion: v1
kind: Service
metadata:
  name: vllm-metal-pool
  labels:
    app: vllm-metal-pool
spec:
  selector:
    app: vllm-metal-pool
    component: epp
  ports:
  - name: default
    protocol: TCP
    port: 9002
    targetPort: 9002
    appProtocol: http2
  - name: zmq
    protocol: TCP
    port: 5557
    targetPort: 5557
    appProtocol: tcp
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  type: ClusterIP
