apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-metal-proxy
  namespace: llm-d-metal
  labels:
    app: vllm-metal-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-metal-proxy
  template:
    metadata:
      labels:
        app: vllm-metal-proxy
        # Labels that InferencePool uses to discover "model server" pods
        llm-d.ai/inference-serving: "true"
    spec:
      containers:
        - name: proxy
          image: vllm-metal-proxy:latest
          imagePullPolicy: Never  # built locally, loaded into Kind
          ports:
            - containerPort: 8000
              name: vllm
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
