apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-metal-proxy
  labels:
    app: vllm-metal-pool
    component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-metal-pool
      component: proxy
  template:
    metadata:
      labels:
        app: vllm-metal-pool
        component: proxy
    spec:
      containers:
        - name: proxy
          image: vllm-metal-proxy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: vllm
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
